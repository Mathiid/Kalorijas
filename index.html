<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<title>Kaloriju sekotājs</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f8f5b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalorijas">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f5f7f4;--card:#ffffff;--ink:#1b2420;--mute:#66726b;--line:#e2e7e2;
  --acc:#2f8f5b;--acc-ink:#ffffff;--acc-soft:#e3f3ea;
  --warn:#d9822b;--bad:#c8473d;--bad-soft:#fbeae8;--warn-soft:#fdf1e2;
  --p:#4f7cff;--c:#e0a82e;--f:#d9643f;--r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1512;--card:#19201c;--ink:#e8ede9;--mute:#8d9a92;--line:#2a332d;
    --acc:#3fae73;--acc-ink:#06140c;--acc-soft:#1c3226;--bad-soft:#3a1f1c;--warn-soft:#38291a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px 14px 8px;padding-top:calc(14px + env(safe-area-inset-top))}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:15px;margin:18px 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.muted{color:var(--mute)}.small{font-size:13px}
button,.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:14px;padding:12px 16px;font-weight:600;text-align:center}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.big{flex-direction:column;padding:22px 10px;font-size:17px;flex:1}
.btn.big .ico{font-size:34px;line-height:1}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.in{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.in:focus{outline:2px solid var(--acc);outline-offset:0}
.in.num{text-align:right}
textarea.in{resize:vertical;min-height:64px}
label.f{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:9px 4px 8px;color:var(--mute);display:flex;flex-direction:column;
  align-items:center;gap:2px;font-size:12px}
.tabs button .ti{font-size:22px;line-height:1}
.tabs button.on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;
  transition:.2s;max-width:88vw;text-align:center;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* dienas navigācija */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav .lbl{flex:1;text-align:center}
.daynav .lbl b{display:block;font-size:18px}
.daynav button.arrow{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
/* kopsavilkums */
.big-kcal{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.big-kcal small{font-size:16px;font-weight:500;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.bar.over>i{background:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{flex:1;min-width:0;white-space:nowrap;background:var(--bg);border-radius:12px;padding:8px 10px;font-size:13px;color:var(--mute)}
.chip b{display:block;color:var(--ink);font-size:16px}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* nedēļa */
.week{display:flex;gap:6px;height:110px}
.wcol{flex:1;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11px;min-width:0}
.wbar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--bg);border-radius:8px;overflow:hidden}
.wbar{width:100%;background:var(--acc);border-radius:6px 6px 0 0;opacity:.55}
.wbar.over{background:var(--bad)}
.wcol.sel .wbar{opacity:1}.wcol.sel{color:var(--ink);font-weight:700}
/* ieraksti */
.entry{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--acc-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.ent-main{flex:1;min-width:0}
.ent-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-kcal{text-align:right;font-weight:800;font-size:18px;line-height:1.1}
.ent-kcal small{display:block;font-weight:500;color:var(--mute);font-size:11px}
.detail{margin:-4px 0 4px;padding:10px 12px;background:var(--bg);border-radius:0 0 14px 14px;border:1px solid var(--line);border-top:0;font-size:14px}
.detail .li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
/* skenēšana */
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{border-radius:12px;padding:10px 12px;font-size:14px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn)}
.notice.err{background:var(--bad-soft);border-color:var(--bad)}
.notice.ok{background:var(--acc-soft);border-color:var(--acc)}
.item{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item .x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--bad);font-size:18px;flex:none}
.unit{display:flex;align-items:center;gap:6px;flex:1}
.unit span{color:var(--mute);font-size:13px;min-width:30px}
.macros{font-size:12.5px;color:var(--mute)}
.totals{background:var(--acc-soft);border:1px solid var(--acc);border-radius:14px;padding:12px}
.totals .tk{font-size:30px;font-weight:800;line-height:1}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--acc-soft);color:var(--acc)}
.badge.low{background:var(--bad-soft);color:var(--bad)}.badge.medium{background:var(--warn-soft);color:var(--warn)}
.previews{display:flex;gap:8px}
.previews img{flex:1;min-width:0;width:100%;max-height:260px;object-fit:cover;border-radius:14px;display:block}
.item .x.star{color:var(--mute)}
.item .x.star.on{color:#e0a82e}
.chipbtn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font-size:14px}
.chipbtn.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.cam{width:100%;max-height:300px;border-radius:14px;background:#000;object-fit:cover}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);flex:none}
a{color:var(--acc)}
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="toast" role="status"></div>

<script>
'use strict';
(function () {

/* ============ Konstantes ============ */
var LS_KEY = 'kalorijas_v1';
var DEFAULTS = { apiKey: '', model: 'gemini-2.5-flash', goal: 2000, plateCm: 0, biasOn: true, lastBackup: 0 };
var MEALS = [
  ['brokastis', 'Brokastis', '🌅'],
  ['pusdienas', 'Pusdienas', '☀️'],
  ['vakarinas', 'Vakariņas', '🌙'],
  ['uzkodas', 'Uzkodas', '🍎']
];
var WEEKDAYS = ['svētdiena', 'pirmdiena', 'otrdiena', 'trešdiena', 'ceturtdiena', 'piektdiena', 'sestdiena'];
var WEEKDAYS_SHORT = ['Sv', 'Pr', 'Ot', 'Tr', 'Ce', 'Pk', 'Se'];
var MONTHS = ['janvāris', 'februāris', 'marts', 'aprīlis', 'maijs', 'jūnijs', 'jūlijs', 'augusts', 'septembris', 'oktobris', 'novembris', 'decembris'];
var CONF_LV = { low: 'Zema pārliecība', medium: 'Vidēja pārliecība', high: 'Augsta pārliecība' };

var SCHEMA = {
  type: 'OBJECT',
  properties: {
    is_food: { type: 'BOOLEAN' },
    meal_name: { type: 'STRING' },
    confidence: { type: 'STRING', enum: ['low', 'medium', 'high'] },
    notes: { type: 'STRING' },
    kcal_min: { type: 'NUMBER' },
    kcal_max: { type: 'NUMBER' },
    questions: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: {
          question: { type: 'STRING' },
          options: { type: 'ARRAY', items: { type: 'STRING' } }
        },
        required: ['question', 'options']
      }
    },
    items: {
      type: 'ARRAY',
      items: {
        type: 'OBJECT',
        properties: {
          name: { type: 'STRING' },
          grams: { type: 'NUMBER' },
          kcal: { type: 'NUMBER' },
          protein_g: { type: 'NUMBER' },
          carbs_g: { type: 'NUMBER' },
          fat_g: { type: 'NUMBER' }
        },
        required: ['name', 'grams', 'kcal', 'protein_g', 'carbs_g', 'fat_g']
      }
    }
  },
  required: ['is_food', 'meal_name', 'confidence', 'notes', 'kcal_min', 'kcal_max', 'questions', 'items']
};

/* ============ Palīgfunkcijas ============ */
function $(s) { return document.querySelector(s); }
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function today() { return ymd(new Date()); }
function num(v) {
  var n = typeof v === 'string' ? parseFloat(v.replace(',', '.')) : Number(v);
  return isFinite(n) && n > 0 ? n : 0;
}
function r0(n) { return Math.round(n); }
function r1(n) { return Math.round(n * 10) / 10; }
function fmt(n) { return Math.round(n).toLocaleString('lv-LV'); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function mealByHour(h) {
  if (h < 10) return 'brokastis';
  if (h < 15) return 'pusdienas';
  if (h < 17) return 'uzkodas';
  if (h < 22) return 'vakarinas';
  return 'uzkodas';
}
function dayLabel(s) {
  var d = parseYmd(s);
  var main = d.getDate() + '. ' + MONTHS[d.getMonth()];
  var sub = WEEKDAYS[d.getDay()];
  if (s === today()) sub = 'šodien, ' + sub;
  else if (s === addDays(today(), -1)) sub = 'vakar, ' + sub;
  return { main: main, sub: sub };
}

/* mazs DOM palīgs (bez innerHTML — lietotāja teksts vienmēr ir tikai teksts) */
function h(tag, props) {
  var el = document.createElement(tag);
  var pendingValue;
  if (props) {
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v === undefined || v === null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'value') pendingValue = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
  }
  function add(k) {
    if (k === null || k === undefined || k === false) return;
    if (Array.isArray(k)) { k.forEach(add); return; }
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  for (var i = 2; i < arguments.length; i++) add(arguments[i]);
  if (pendingValue !== undefined) el.value = pendingValue;
  return el;
}

var toastTimer;
function toast(msg) {
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ============ Dati (localStorage) ============ */
var db = load();
function load() {
  try {
    var r = JSON.parse(localStorage.getItem(LS_KEY));
    if (r && Array.isArray(r.entries)) {
      return {
        settings: Object.assign({}, DEFAULTS, r.settings || {}),
        entries: r.entries,
        foods: Array.isArray(r.foods) ? r.foods : []
      };
    }
  } catch (e) { /* tukšs */ }
  return { settings: Object.assign({}, DEFAULTS), entries: [], foods: [] };
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(db)); }
  catch (e) { toast('Neizdevās saglabāt datus (vieta pilna?)'); }
}

/* ============ Stāvoklis ============ */
var S = {
  view: location.hash === '#scan' ? 'scan' : (db.settings.apiKey ? 'today' : 'settings'),
  day: today(),
  draft: null,
  note: '',
  open: {},
  delId: null,
  keyVisible: false,
  clearArmed: false,
  testMsg: null,
  installDismissed: false,
  ref: '',
  twoPhotos: false,
  persisted: null,
  backupDismissed: false,
  biasResetArmed: false
};
var T = null; // kopsummu elementu atsauces skenēšanas skatā

/* ============ Instalēšana (PWA) ============ */
var deferredInstall = null;
function isStandalone() {
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function doInstall() {
  if (!deferredInstall) return;
  var ev = deferredInstall;
  ev.prompt();
  ev.userChoice.then(function () { deferredInstall = null; render(); }, function () { deferredInstall = null; render(); });
}
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  deferredInstall = e;
  if (S.view !== 'scan') render();
});
window.addEventListener('appinstalled', function () {
  deferredInstall = null;
  toast('Aplikācija uzstādīta');
  if (S.view !== 'scan') render();
});
function installCard() {
  if (isStandalone()) return h('div', { class: 'notice ok' }, '✓ Aplikācija ir uzstādīta šajā ierīcē.');
  var box = h('div', { class: 'card stack' }, h('b', null, '📲 Uzstādīt kā aplikāciju'));
  if (deferredInstall) {
    box.append(h('div', { class: 'small muted' }, 'Pievienosies sākuma ekrānam ar kruasāna ikonu un atvērsies pilnā ekrānā, bez pārlūka joslas.'),
      h('button', { class: 'btn pri', onclick: doInstall }, '⬇ Instalēt aplikāciju'));
  } else if (!/^https?:$/.test(location.protocol)) {
    box.append(h('div', { class: 'small muted' }, 'Instalēšanai aplikācija jāatver no tīmekļa adreses (HTTPS), nevis kā lokāls fails.'));
  } else if (isIOS()) {
    box.append(h('div', { class: 'small muted' }, 'iPhone/iPad: Safari → ikona „Kopīgot” → „Pievienot sākuma ekrānam”.'));
  } else {
    box.append(h('div', { class: 'small muted' }, 'Pārlūka izvēlnē (⋮) izvēlies „Instalēt aplikāciju” vai „Pievienot sākuma ekrānam”.'));
  }
  return box;
}

/* ============ Ēdiena vienības ============ */
function blankItem() {
  return { name: '', grams: 0, kcal: 0, p: 0, c: 0, f: 0, per: null };
}
function mkItem(o) {
  var it = {
    name: String(o.name || 'Produkts').slice(0, 80),
    grams: r1(num(o.grams)),
    kcal: r0(num(o.kcal)),
    p: r1(num(o.protein_g)),
    c: r1(num(o.carbs_g)),
    f: r1(num(o.fat_g)),
    per: null,
    fav: false
  };
  if (it.grams > 0) it.per = { kcal: it.kcal / it.grams, p: it.p / it.grams, c: it.c / it.grams, f: it.f / it.grams };
  return it;
}
function sumItems(items) {
  return items.reduce(function (a, i) {
    return { kcal: a.kcal + (i.kcal || 0), p: a.p + (i.p || 0), c: a.c + (i.c || 0), f: a.f + (i.f || 0) };
  }, { kcal: 0, p: 0, c: 0, f: 0 });
}
function dayEntries(day) {
  return db.entries.filter(function (e) { return e.date === day; })
    .sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
}
function sumEntries(list) { return sumItems(list); }

/* ============ Attēla apstrāde ============ */
function loadImage(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () { res({ img: img, url: url }); };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('Neizdevās nolasīt attēlu. Mēģini JPG vai PNG.')); };
    img.src = url;
  });
}
function scaleTo(img, max, q) {
  var w = img.naturalWidth, hh = img.naturalHeight;
  var k = Math.min(1, max / Math.max(w, hh));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k));
  c.height = Math.max(1, Math.round(hh * k));
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
function onFile(file) {
  if (!file) return;
  readPhoto(file).then(function (p) {
    S.draft = newDraft(p.full, p.thumb);
    S.view = 'scan';
    render();
    if (S.draft.status === 'loading') runAnalysis();
  }).catch(function (e) { toast(e.message); });
}
function newDraft(img, thumb) {
  return {
    img: img, img2: null, thumb: thumb,
    status: img ? (S.twoPhotos ? 'second' : 'loading') : 'done', error: '',
    name: '', meal: mealByHour(new Date().getHours()), date: today(),
    items: img ? [] : [blankItem()], conf: '', notes: '', isFood: true,
    questions: [], answers: [], hasRange: false, lo: 1, hi: 1, ref: getRef(),
    editId: null, bias: null, estTotal: 0
  };
}

/* ============ Gemini ============ */
function buildPrompt(o) {
  var ref = refText(o.ref);
  var foods = foodsForPrompt();
  var ans = (o.answers || []).map(function (a) { return '- ' + a.q + ' -> ' + a.a; }).join('\n');
  return 'You are a careful nutrition assistant. ' +
    (o.hasSecond
      ? 'The first photo is a top-down or front view and the second photo is a side view of the same single meal; use both to judge portion height and volume.\n'
      : 'The photo shows a single meal or food portion.\n') +
    '1. Identify every distinct food or drink item you can see (list sauces, oils, spreads and side items separately when visible).\n' +
    '2. Estimate the weight of each item in grams, using visual cues such as plate or bowl size (a dinner plate is usually 24-27 cm), cutlery, hands, packaging and food thickness.\n' +
    '3. Give calories (kcal) and macronutrients in grams for that exact portion. Keep kcal roughly consistent with protein*4 + carbs*4 + fat*9.\n' +
    '4. Include hidden calories when likely (cooking oil, dressing, butter) and mention such assumptions in "notes".\n' +
    '5. If the image is not food, set is_food to false and return an empty items array.\n' +
    '6. Give kcal_min and kcal_max: the realistic low and high total kcal for the whole meal, reflecting your uncertainty about portion size and hidden fats.\n' +
    '7. Add up to 3 short clarifying questions in Latvian, each with 2-4 short answer options, ONLY about things you cannot see that could change the total by roughly 10% or more (for example cooking oil, sauce, sugar in a drink, fat content, bread and butter). Return an empty questions array if nothing important is unclear. Never ask about things already visible or already answered.\n' +
    'Write item names, meal_name, notes and questions in Latvian. meal_name is a short name for the whole meal. confidence is "low", "medium" or "high".\n' +
    (ref ? 'Scale reference: ' + ref + '. Use it to calibrate portion sizes.\n' : '') +

function runAnalysis() {

  analyzeImage(d).then(function (r) {
    if (S.draft !== d) return;
    var raw = r.items.map(mkItem);
    var rawSum = sumItems(raw).kcal;

    var est = 0;

      if (findFood(it.name) && it.grams > 0) return applyMyFood(it);   // lietotāja paša vērtības netiek koriģētas
      it.fromModel = true;
      it.estKcal = it.kcal;                                            // modeļa sākotnējais aprēķins (pirms korekcijas)

/* ============ Saglabāšana žurnālā ============ */
function saveDraft() {
  var d = S.draft;
  rememberFoods(d.items);
  var items = d.items
    .filter(function (it) { return it.name.trim() || it.kcal > 0; })
    .map(function (it) {
      return { name: it.name.trim() || 'Produkts', grams: r0(it.grams), kcal: r0(it.kcal), p: r1(it.p), c: r1(it.c), f: r1(it.f) };
    });
  if (!items.length) { toast('Pievieno vismaz vienu produktu'); return; }
  var tot = sumItems(items);
  var orig = null;
  if (d.editId) {
    for (var i = 0; i < db.entries.length; i++) if (db.entries[i].id === d.editId) orig = db.entries[i];
  }
  var base = orig && orig.ts ? new Date(orig.ts) : new Date();
  var when = parseYmd(d.date);
  when.setHours(base.getHours(), base.getMinutes(), base.getSeconds());
  var entry = {
    id: orig ? orig.id : uid(), date: d.date, ts: when.getTime(), meal: d.meal,
    name: (d.name || '').trim() || items.map(function (i) { return i.name; }).join(', ').slice(0, 60),
    items: items, kcal: r0(tot.kcal), p: r1(tot.p), c: r1(tot.c), f: r1(tot.f),
    thumb: d.thumb || null
  };
  if (d.hasRange && tot.kcal > 0) { entry.lo = r0(tot.kcal * d.lo); entry.hi = r0(tot.kcal * d.hi); }
  if (orig) {
    // labojot ierakstu, modeļa kļūdas dati paliek, galīgā vērtība tiek pārskaitīta proporcionāli
    if (orig.est > 0 && orig.fin > 0) {
      entry.est = orig.est;
      entry.fin = orig.kcal > 0 ? Math.max(1, r0(orig.fin * entry.kcal / orig.kcal)) : orig.fin;
    }
    db.entries[db.entries.indexOf(orig)] = entry;
  } else {
    if (d.estTotal > 0) {
      var fin = d.items.reduce(function (a, it) { return a + (it.fromModel ? (it.kcal || 0) : 0); }, 0);
      if (fin > 0) { entry.est = r0(d.estTotal); entry.fin = r0(fin); }
    }
    db.entries.push(entry);
  }
  save();
  S.day = d.date;
  S.draft = null;
  S.note = '';
  S.view = 'today';
  toast(orig ? 'Izmaiņas saglabātas' : 'Saglabāts žurnālā');
  render();
}

function normName(s) { return String(s || '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function findFood(name) {
  var n = normName(name);
  if (!n) return null;
  for (var i = 0; i < db.foods.length; i++) {
    if (normName(db.foods[i].name) === n) return db.foods[i];
  }
  return null;
}
function itemFromPer(name, grams, per, extra) {
  var it = {
    name: name, grams: grams,
    kcal: r0(per.kcal * grams), p: r1(per.p * grams), c: r1(per.c * grams), f: r1(per.f * grams),
    per: { kcal: per.kcal, p: per.p, c: per.c, f: per.f }, fav: false

}

  var f = findFood(it.name);

}

  items.forEach(function (it) {

    var per = { kcal: it.kcal / it.grams, p: (it.p || 0) / it.grams, c: (it.c || 0) / it.grams, f: (it.f || 0) / it.grams };

}

    .slice(0, 25)
    .map(function (f) {
      return f.name + ': ' + r0(f.per.kcal * 100) + ' kcal / P ' + r1(f.per.p * 100) + ' / C ' + r1(f.per.c * 100) + ' / F ' + r1(f.per.f * 100);

/* ============ Svītrkods (Open Food Facts) ============ */
function lookupBarcode(raw) {
  var code = String(raw).replace(/\D/g, '');
  if (code.length < 8) return Promise.reject(new Error('Svītrkodā jābūt vismaz 8 cipariem.'));
  var url = 'https://world.openfoodfacts.org/api/v2/product/' + code +
    '?fields=product_name,product_name_lv,brands,nutriments,serving_quantity';
  return fetch(url).then(function (res) {
    if (!res.ok && res.status !== 404) throw new Error('Open Food Facts kļūda ' + res.status);
    return res.json().catch(function () { return null; });
  }).then(function (j) {
    var p = j && j.product;
    if (!j || j.status !== 1 || !p) throw new Error('Produkts nav atrasts Open Food Facts datubāzē. Pievieno to pats.');
    var n = p.nutriments || {};
    var kcal100 = num(n['energy-kcal_100g']) || (num(n['energy_100g']) ? num(n['energy_100g']) / 4.184 : 0);
    if (!kcal100) throw new Error('Šim produktam datubāzē nav norādītas kalorijas.');
    var brand = p.brands ? String(p.brands).split(',')[0].trim() : '';
    var name = String(p.product_name_lv || p.product_name || 'Produkts').trim() + (brand ? ' (' + brand + ')' : '');
    return {
      name: name.slice(0, 80),
      grams: num(p.serving_quantity) || 100,
      per: { kcal: kcal100 / 100, p: num(n.proteins_100g) / 100, c: num(n.carbohydrates_100g) / 100, f: num(n.fat_100g) / 100 }
    };
  }).catch(function (e) {
    if (e instanceof TypeError) throw new Error('Nav savienojuma ar Open Food Facts.');
    throw e;
  });
}
function makeSheet(title, body, onClose) {
  var closed = false;
  var el = h('div', { class: 'sheet', onclick: function (e) { if (e.target === el) close(); } },
    h('div', { class: 'panel stack' },
      h('div', { class: 'row' },
        h('b', { class: 'grow', style: { fontSize: '18px' } }, title),
        h('button', { class: 'btn sm', onclick: function () { close(); } }, 'Aizvērt')),
      body));
  function close() {
    if (closed) return;
    closed = true;

  }

  return { close: close };
}
function openBarcode() {
  var closed = false, stream = null, timer = null, busy = false, lastCode = '';
  var hasDet = 'BarcodeDetector' in window;
  var detector = null;
  if (hasDet) {
    try { detector = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }); }
    catch (e) { try { detector = new window.BarcodeDetector(); } catch (e2) { detector = null; } }
  }
  var status = h('div', { class: 'small muted' }, detector
    ? 'Pavērs kameru pret svītrkodu…'
    : 'Šajā pārlūkā automātiska nolasīšana nav pieejama (piem., iPhone Safari). Ievadi ciparus zem svītrkoda.');
  var video = h('video', { class: 'cam', playsinline: true, autoplay: true });
  video.muted = true;
  var codeIn = h('input', { class: 'in', type: 'text', inputmode: 'numeric', placeholder: 'Svītrkoda cipari (8–14)', autocomplete: 'off',
    onkeydown: function (e) { if (e.key === 'Enter') go(codeIn.value); } });
  var body = h('div', { class: 'stack' }, detector ? video : null, status,
    h('div', { class: 'row' }, codeIn, h('button', { class: 'btn pri', onclick: function () { go(codeIn.value); } }, 'Meklēt')));
  var sheet = makeSheet('Svītrkods', body, cleanup);

  function cleanup() {
    closed = true;
    clearTimeout(timer);
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }
  function go(code) {
    if (busy || closed) return;
    var digits = String(code).replace(/\D/g, '');
    busy = true;
    status.textContent = 'Meklēju ' + digits + '…';
    lookupBarcode(digits).then(function (p) {
      if (closed) return;
      sheet.close();
      addItemToDraft(itemFromPer(p.name, p.grams, p.per, { fromBarcode: true }));
      toast('Pievienots: ' + p.name);
    }, function (e) {
      if (closed) return;
      status.textContent = e.message;
      lastCode = digits;
      busy = false;
      loop();
    });
  }
  function loop() {
    if (closed || !detector || busy) return;
    var p;
    try { p = detector.detect(video); } catch (e) { timer = setTimeout(loop, 500); return; }
    p.then(function (codes) {
      if (closed) return;
      for (var i = 0; i < codes.length; i++) {
        if (codes[i].rawValue && codes[i].rawValue !== lastCode) { go(codes[i].rawValue); return; }
      }
      timer = setTimeout(loop, 350);
    }, function () { if (!closed) timer = setTimeout(loop, 500); });
  }
  if (detector && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (s) {
      if (closed) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
      stream = s;
      video.srcObject = s;
      var pl = video.play();
      if (pl && pl.catch) pl.catch(function () {});
      loop();
    }, function () { status.textContent = 'Kamera nav pieejama — atļauj piekļuvi vai ievadi ciparus zemāk.'; });
  } else if (detector) {
    status.textContent = 'Kamera nav pieejama. Ievadi svītrkoda ciparus zemāk.';
  }
}

/* ============ Ierakstu labošana ============ */
function editEntry(e) {
  var d = newDraft(null, null);
  d.editId = e.id;
  d.name = e.name;
  d.meal = e.meal;
  d.date = e.date;
  d.thumb = e.thumb || null;
  d.items = e.items.map(function (it) {
    var o = { name: it.name, grams: it.grams || 0, kcal: it.kcal || 0, p: it.p || 0, c: it.c || 0, f: it.f || 0, per: null, fav: false };
    if (o.grams > 0) o.per = { kcal: o.kcal / o.grams, p: o.p / o.grams, c: o.c / o.grams, f: o.f / o.grams };
    return o;
  });
  if (!d.items.length) d.items = [blankItem()];
  if (e.lo && e.kcal > 0) { d.hasRange = true; d.lo = e.lo / e.kcal; d.hi = e.hi / e.kcal; }

/* ============ Personīgā korekcija ============ */
function scaleItem(it, k) {
  it.kcal = r0(it.kcal * k);
  it.p = r1(it.p * k);
  it.c = r1(it.c * k);
  it.f = r1(it.f * k);
  if (it.grams > 0) it.per = { kcal: it.kcal / it.grams, p: it.p / it.grams, c: it.c / it.grams, f: it.f / it.grams };
}
function biasInfo() {
  var xs = db.entries
    .filter(function (e) { return e.est > 0 && e.fin > 0; })
    .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); })
    .slice(0, 30)
    .map(function (e) { return e.fin / e.est; })
    .filter(function (r) { return r >= 0.4 && r <= 2.5; });
  var n = xs.length;
  if (n < 5) return { n: n, factor: 1, raw: 1 };
  xs.sort(function (a, b) { return a - b; });
  var med = n % 2 ? xs[(n - 1) / 2] : (xs[n / 2 - 1] + xs[n / 2]) / 2;
  var f = 1 + (med - 1) * Math.min(1, n / 15);     // sākumā korekcija ir piesardzīga
  f = Math.max(0.7, Math.min(1.4, f));
  return { n: n, factor: f, raw: med };
}
function fmtFactor(f) { return (Math.round(f * 100) / 100).toFixed(2).replace('.', ','); }
function biasCard() {
  var info = biasInfo();
  var on = db.settings.biasOn !== false;
  var status;
  if (info.n < 5) status = 'Vajag vēl ' + (5 - info.n) + ' ierakstus no foto, lai korekcija varētu ieslēgties (pašlaik ' + info.n + ').';
  else if (Math.abs(info.factor - 1) < 0.03) status = 'Pēc ' + info.n + ' ierakstiem korekcijas nav — modelis tev trāpa labi.';
  else status = 'Pēc ' + info.n + ' ierakstiem modeļa aprēķins tiek reizināts ar ×' + fmtFactor(info.factor) + '.';
  var armed = S.biasResetArmed;
  return h('div', { class: 'card stack' },
    h('b', null, '🎯 Personīgā korekcija'),
    h('div', { class: 'small muted' }, 'Aplikācija salīdzina modeļa aprēķinu ar to, ko tu pēc tam izlaboji. Ja modelis tev sistemātiski kļūdās vienā virzienā, nākamie aprēķini tiek pielāgoti. Darbojas tikai ar ierakstiem no foto.'),
    h('label', { class: 'row small' },
      h('input', { type: 'checkbox', checked: on, onchange: function (e) { db.settings.biasOn = e.target.checked; save(); render(); } }),
      'Izmantot korekciju'),
    h('div', { class: 'small' }, status),
    h('button', { class: 'btn sm danger', onclick: function () {
      if (!S.biasResetArmed) { S.biasResetArmed = true; render(); return; }
      db.entries.forEach(function (e) { delete e.est; delete e.fin; });
      S.biasResetArmed = false; save(); toast('Korekcijas dati atiestatīti'); render();
    } }, armed ? 'Vēlreiz — atiestatīt korekciju' : 'Atiestatīt korekcijas datus'));
}

/* ============ Rezerves kopija ============ */
function backupPayload() {
  return {
    version: 2,
    settings: { model: db.settings.model, goal: db.settings.goal, plateCm: db.settings.plateCm },
    entries: db.entries,
    foods: db.foods
  };
}
function markBackup() { db.settings.lastBackup = Date.now(); save(); }
function backupLabel() {
  var lb = num(db.settings.lastBackup);
  if (!lb) return 'vēl nav veikta';
  var days = Math.floor((Date.now() - lb) / 864e5);
  return days <= 0 ? 'šodien' : (days === 1 ? 'vakar' : 'pirms ' + days + ' d.');
}
function backupDue() {
  var lb = num(db.settings.lastBackup);
  return db.entries.length >= 3 && !S.backupDismissed && (!lb || Date.now() - lb > 7 * 864e5);
}
function shareBackup() {
  var name = 'kalorijas-kopija-' + today() + '.json';
  var text = JSON.stringify(backupPayload());
  var file = null;
  if (navigator.share && navigator.canShare && typeof File === 'function') {
    var types = ['application/json', 'text/plain'];
    for (var i = 0; i < types.length && !file; i++) {
      try {
        var f = new File([text], name, { type: types[i] });
        if (navigator.canShare({ files: [f] })) file = f;
      } catch (e) { /* nākamais tips */ }
    }
  }
  if (!file) {
    download(name, 'application/json', text);
    markBackup(); toast('Kopija lejupielādēta'); render();
    return;
  }
  navigator.share({ files: [file], title: 'Kaloriju sekotāja kopija' }).then(function () {
    markBackup(); toast('Kopija saglabāta'); render();
  }, function (e) {
    if (e && e.name === 'AbortError') return;
    download(name, 'application/json', text);
    markBackup(); toast('Kopija lejupielādēta'); render();
  });
}

function macroChip(color, label, grams) {

}
function weekChart() {

  var vals = days.map(function (d) { return sumEntries(dayEntries(d)).kcal; });

  return h('div', { class: 'week' }, days.map(function (d, i) {
    var over = goal && vals[i] > goal;

    return h('button', { class: 'wcol' + (d === S.day ? ' sel' : ''), onclick: function () { S.day = d; render(); } },

      h('div', null, WEEKDAYS_SHORT[parseYmd(d).getDay()]),
      h('div', null, vals[i] ? fmt(vals[i]) : '–'));

}

    h('button', { class: 'btn sm', onclick: openBarcode }, '▦ Svītrkods'),
    h('button', { class: 'btn sm', onclick: function () { openFoods(function (f) { addItemToDraft(foodToItem(f)); }); } }, '★ Mani ēdieni')));

  var tk = h('div', { class: 'tk' });
  var tm = h('div', { class: 'muted small', style: { marginTop: '6px' } });
  var tr = h('div', { class: 'small', style: { marginTop: '2px' } });
  T = { kcal: tk, macros: tm, range: tr };
  wrap.append(h('div', { class: 'totals' }, h('div', { class: 'small muted' }, 'Kopā'),
    h('div', { class: 'row', style: { alignItems: 'baseline', gap: '6px' } }, tk, h('span', { class: 'muted' }, 'kcal')), tm, tr));
  updateTotals();

  if (d.questions && d.questions.length) wrap.append(questionsCard(d));

  if (d.img) {
    wrap.append(noteBox);
    var extra = h('div', { class: 'row wrap' },
      h('button', { class: 'btn sm', onclick: runAnalysis }, '↻ Analizēt vēlreiz ar piezīmi'));
    if (!d.img2) {
      extra.append(h('label', { class: 'btn sm' }, '📸 Pievienot foto no sāna',
        h('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true,
          onchange: function (e) { onSecondFile(e.target.files[0]); } })));
    }
    wrap.append(extra);
  }

  var mealSel = h('select', { class: 'in', value: d.meal, onchange: function (e) { d.meal = e.target.value; } },
    MEALS.map(function (m) { return h('option', { value: m[0] }, m[2] + ' ' + m[1]); }));
  var dateIn = h('input', { class: 'in', type: 'date', value: d.date, onchange: function (e) { if (e.target.value) d.date = e.target.value; } });
  wrap.append(h('div', { class: 'row' },
    h('div', { class: 'grow' }, h('label', { class: 'f' }, 'Ēdienreize'), mealSel),
    h('div', { class: 'grow' }, h('label', { class: 'f' }, 'Datums'), dateIn)));

  wrap.append(h('div', { class: 'row' },
    h('button', { class: 'btn pri grow', onclick: saveDraft }, d.editId ? '✓ Saglabāt izmaiņas' : '✓ Saglabāt žurnālā'),
    h('button', { class: 'btn', onclick: cancelDraft }, 'Atcelt')));
  return wrap;
}
function itemRow(it, onRemove) {
  var nameI = h('input', { class: 'in', type: 'text', value: it.name, placeholder: 'Produkts',
    oninput: function () { it.name = nameI.value; } });
  var gI = h('input', { class: 'in num', type: 'text', inputmode: 'decimal', placeholder: '0', value: it.grams ? String(it.grams) : '' });
  var kI = h('input', { class: 'in num', type: 'text', inputmode: 'decimal', placeholder: '0', value: it.kcal ? String(it.kcal) : '' });
  var mac = h('div', { class: 'macros' });
  var star = h('button', { class: 'x star' + (it.fav ? ' on' : ''), title: 'Saglabāt maniem ēdieniem',
    'aria-label': 'Saglabāt maniem ēdieniem', onclick: function () { it.fav = !it.fav; paintStar(); } }, it.fav ? '★' : '☆');
  function paintStar() {
    star.textContent = it.fav ? '★' : '☆';
    star.classList.toggle('on', !!it.fav);
  }
  function paint() { mac.textContent = 'Olb. ' + r1(it.p) + ' g · Ogļ. ' + r1(it.c) + ' g · Tauk. ' + r1(it.f) + ' g'; }
  gI.addEventListener('input', function () {
    var g = num(gI.value);
    it.grams = g;
    if (it.per && g > 0) {
      it.kcal = r0(it.per.kcal * g);
      it.p = r1(it.per.p * g);
      it.c = r1(it.per.c * g);
      it.f = r1(it.per.f * g);
      kI.value = String(it.kcal);
    }
    paint(); updateTotals();
  });
  kI.addEventListener('input', function () {
    it.kcal = r0(num(kI.value));
    if (it.grams > 0) {
      it.per = it.per || { kcal: 0, p: 0, c: 0, f: 0 };
      it.per.kcal = it.kcal / it.grams;
    }
    if (it.kcal > 0) { it.fav = true; paintStar(); } // labojums tiek iegaumēts
    updateTotals();
  });
  paint();
  var tag = it.fromFoods ? '★ ņemts no maniem ēdieniem' : (it.fromBarcode ? '▦ dati no Open Food Facts datubāzes' : null);
  return h('div', { class: 'item' },
    h('div', { class: 'row' }, nameI, star,
      h('button', { class: 'x', 'aria-label': 'Noņemt', onclick: onRemove }, '✕')),
    h('div', { class: 'row' },
      h('label', { class: 'unit' }, gI, h('span', null, 'g')),
      h('label', { class: 'unit' }, kI, h('span', null, 'kcal'))),
    mac,
    tag ? h('div', { class: 'small', style: { color: 'var(--acc)' } }, tag) : null);
}

/* ---------- Iestatījumi ---------- */
function viewSettings() {
  var s = db.settings;
  var wrap = h('div', { class: 'stack' });
  wrap.append(h('h1', null, 'Iestatījumi'));
  wrap.append(installCard());

  if (!String(s.apiKey).trim()) {
    wrap.append(h('div', { class: 'notice' },
      h('b', null, 'Pirmā palaišana. '),
      'Foto analīzei tiek izmantots Google Gemini. Bezmaksas atslēgu vari izveidot šeit: ',
      h('a', { href: 'https://aistudio.google.com/apikey', target: '_blank', rel: 'noopener' }, 'aistudio.google.com/apikey'),
      '. Ielīmē to zemāk.'));
  }

  var keyIn = h('input', { class: 'in', type: S.keyVisible ? 'text' : 'password', value: s.apiKey,
    autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'AIza…',
    onchange: function (e) { db.settings.apiKey = e.target.value.trim(); save(); S.testMsg = null; toast('Atslēga saglabāta'); } });
  wrap.append(h('div', { class: 'card stack' },
    h('div', null, h('label', { class: 'f' }, 'Gemini API atslēga'),
      h('div', { class: 'row' }, keyIn,
        h('button', { class: 'btn sm', onclick: function () { S.keyVisible = !S.keyVisible; render(); } }, S.keyVisible ? 'Slēpt' : 'Rādīt'))),
    h('div', null, h('label', { class: 'f' }, 'Modelis'),
      h('input', { class: 'in', type: 'text', value: s.model, list: 'models', autocapitalize: 'off', spellcheck: 'false',
        onchange: function (e) { db.settings.model = e.target.value.trim() || DEFAULTS.model; save(); toast('Modelis saglabāts'); render(); } }),
      h('datalist', { id: 'models' },
        ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.5-pro'].map(function (m) { return h('option', { value: m }); })),
      h('div', { class: 'small muted', style: { marginTop: '4px' } }, 'Ja modelis nav atrasts, ieraksti jaunāko Gemini Flash nosaukumu no Google AI Studio.')),
    h('div', null, h('label', { class: 'f' }, 'Dienas mērķis (kcal)'),
      h('input', { class: 'in', type: 'text', inputmode: 'numeric', value: s.goal ? String(s.goal) : '',
        onchange: function (e) { db.settings.goal = r0(num(e.target.value)); save(); toast('Mērķis saglabāts'); } })),
    h('div', null, h('label', { class: 'f' }, 'Šķīvja diametrs (cm) — neobligāti, palīdz noteikt porcijas izmēru'),
      h('input', { class: 'in', type: 'text', inputmode: 'decimal', placeholder: 'piem., 26', value: s.plateCm ? String(s.plateCm) : '',
        onchange: function (e) { db.settings.plateCm = r1(num(e.target.value)); save(); toast('Šķīvja izmērs saglabāts'); } })),
    h('div', { class: 'row wrap' },
      h('button', { class: 'btn sm', onclick: testConnection }, '🔌 Pārbaudīt savienojumu'),
      S.testMsg ? h('span', { class: 'small', style: { color: S.testMsg.ok ? 'var(--acc)' : 'var(--bad)' } }, S.testMsg.text) : null)));

  var fileIn = h('input', { type: 'file', accept: 'application/json,.json', hidden: true,
    onchange: function (e) { importJson(e.target.files[0]); } });
  wrap.append(biasCard());
  wrap.append(h('h2', null, 'Dati'),
    h('div', { class: 'card stack' },
      h('div', { class: 'small muted' }, 'Ieraksti glabājas tikai šajā ierīcē (pārlūka krātuvē). Ja pārlūka dati tiek notīrīti vai telefons nomainīts, tie pazūd — dari rezerves kopiju.'),
      h('div', { class: 'small' }, '💾 Pēdējā rezerves kopija: ' + backupLabel()),
      S.persisted === null ? null : h('div', { class: 'small', style: { color: S.persisted ? 'var(--acc)' : 'var(--warn)' } },
        S.persisted ? '🔒 Pastāvīgā krātuve ieslēgta — pārlūks datus pats nedzēsīs.' : '⚠ Pastāvīgā krātuve nav piešķirta. Uzstādi aplikāciju sākuma ekrānā, lai samazinātu datu zaudēšanas risku.'),
      h('div', { class: 'row wrap' },
        h('button', { class: 'btn sm pri', onclick: shareBackup }, '📤 Saglabāt kopiju'),
        h('button', { class: 'btn sm', onclick: exportCsv }, '⬇ CSV'),
        h('button', { class: 'btn sm', onclick: exportJson }, '⬇ JSON kopija'),
        h('label', { class: 'btn sm' }, '⬆ Importēt JSON', fileIn)),
      h('button', { class: 'btn sm', onclick: function () { openFoods(null); } }, '★ Mani ēdieni (' + db.foods.length + ')'),
      h('button', { class: 'btn sm danger', onclick: function () {
        if (!S.clearArmed) { S.clearArmed = true; render(); return; }
        db.entries = []; save(); S.clearArmed = false; toast('Visi ieraksti izdzēsti'); render();
      } }, S.clearArmed ? 'Vēlreiz — izdzēst VISUS ierakstus' : '🗑 Izdzēst visus ierakstus')));

  wrap.append(h('div', { class: 'card small muted' },
    h('b', { style: { color: 'var(--ink)' } }, 'Privātums. '),
    'Foto tiek nosūtīts Google Gemini API analīzei. API atslēga glabājas tikai šajā ierīcē. ',
    'Kaloriju vērtības ir aptuvenas un neaizstāj uztura speciālista vai ārsta padomu.'));
  return wrap;
}
function testConnection() {
  S.testMsg = { ok: true, text: 'Pārbaudu…' };
  render();
  var key = String(db.settings.apiKey).trim();
  if (!key) { S.testMsg = { ok: false, text: 'Nav ievadīta atslēga.' }; render(); return; }
  fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(modelName()), {
    headers: { 'x-goog-api-key': key }
  }).then(function (res) {
    if (res.ok) { S.testMsg = { ok: true, text: '✓ Savienojums darbojas' }; render(); return; }
    return readError(res).then(function (m) { S.testMsg = { ok: false, text: apiErrorText(res.status, m) }; render(); });
  }).catch(function () {
    S.testMsg = { ok: false, text: 'Nav savienojuma ar Gemini.' }; render();
  });
}

/* ============ Eksports / imports ============ */
function download(name, mime, text) {
  var url = URL.createObjectURL(new Blob([text], { type: mime }));
  var a = h('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
}
function csvCell(v) {
  var s = String(v === undefined || v === null ? '' : v);
  return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  var rows = [['Datums', 'Laiks', 'Ēdienreize', 'Ieraksts', 'Produkts', 'Grami', 'kcal', 'Olbaltumvielas g', 'Ogļhidrāti g', 'Tauki g']];
  db.entries.slice().sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); }).forEach(function (e) {
    var t = new Date(e.ts || 0);
    e.items.forEach(function (it) {
      rows.push([e.date, pad(t.getHours()) + ':' + pad(t.getMinutes()), e.meal, e.name, it.name, it.grams, it.kcal, it.p, it.c, it.f]);
    });
  });
  var text = rows.map(function (r) {
    return r.map(function (c) { return csvCell(typeof c === 'number' ? String(c).replace('.', ',') : c); }).join(';');
  }).join('\r\n');
  download('kalorijas-' + today() + '.csv', 'text/csv;charset=utf-8', '﻿' + text);
}
function exportJson() {
  download('kalorijas-kopija-' + today() + '.json', 'application/json', JSON.stringify(backupPayload()));
  markBackup();
  toast('Kopija lejupielādēta');
  render();
}
function importJson(file) {
  if (!file) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var j = JSON.parse(fr.result);
      if (!j || !Array.isArray(j.entries)) throw new Error('bad');
      var have = {};
      db.entries.forEach(function (e) { have[e.id] = true; });
      var added = 0;
      j.entries.forEach(function (e) {
        if (e && e.id && e.date && Array.isArray(e.items) && !have[e.id]) { db.entries.push(e); have[e.id] = true; added++; }
      });
      var foodsAdded = 0;
      (Array.isArray(j.foods) ? j.foods : []).forEach(function (f) {
        if (f && f.name && f.per && !findFood(f.name)) { db.foods.push(f); foodsAdded++; }
      });
      if (j.settings && j.settings.goal && !db.settings.goal) db.settings.goal = num(j.settings.goal);
      if (j.settings && j.settings.plateCm && !db.settings.plateCm) db.settings.plateCm = num(j.settings.plateCm);
      save();
      toast('Importēti ieraksti: ' + added + (foodsAdded ? ', ēdieni: ' + foodsAdded : ''));
      render();
    } catch (e) { toast('Neizdevās importēt — nederīgs fails'); }
  };
  fr.readAsText(file);
}

    if (p || !navigator.storage.persist) return p;
    return navigator.storage.persist();
  }).then(function (ok) {
    S.persisted = !!ok;
    if (S.view === 'settings') render();
  }).catch(function () {});
}

  if (location.hash === '#scan') { S.view = 'scan'; render(); }

render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}

})();
